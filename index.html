<!doctype html>
<html lang="en" data-role="admin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Library</title>
<!-- Bump ?v= on every release so browsers and GitHub Pages never mix old and new files. -->
<link rel="stylesheet" href="styles.css?v=60">
<!-- Light or dark is decided before the first paint, so a page meant to be
     light never flashes dark on its way there. -->
<script src="js/theme.js?v=60"></script>
<link rel="icon" href="icons/favicon.svg?v=60" type="image/svg+xml">
<link rel="alternate icon" href="icons/favicon-32.png?v=60" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=60">
<link rel="manifest" href="manifest.webmanifest?v=60">
<meta name="theme-color" content="#5f6b2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Library">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<header class="topbar">
  <div class="topbar-main">
    <div class="brand">
      <img class="brand-mark" src="icons/favicon.svg?v=60" alt="" width="22" height="22">
      <span id="brand-name">Classroom Library</span>
    </div>
    <button type="button" id="sync-pill" class="sync-pill" hidden></button>
    <button type="button" id="who" class="who" hidden></button>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" data-route="circulation" role="tab">Circulation</button>
    <button class="tab" data-route="catalog"     role="tab">Catalog</button>
    <button class="tab" data-route="shelves"     role="tab">Shelves</button>
    <button class="tab" data-route="patrons"     role="tab">Students</button>
    <button class="tab" data-route="holds"       role="tab">Holds <span class="pill" id="holds-pill" hidden>0</span></button>
    <button class="tab" data-route="reports"     role="tab">Reports</button>
    <button class="tab" data-route="settings"    role="tab">Settings</button>
  </nav>
</header>

<main id="view" class="view" tabindex="-1"></main>

<dialog id="modal">
  <div class="modal-shell">
    <div class="modal-head">
      <h2 id="modal-title">Dialog</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="print-area" class="print-area"></div>

<script src="js/config.js?v=60"></script>
<script src="js/util.js?v=60"></script>
<script src="js/store.js?v=60"></script>
<script src="js/genre-art.js?v=60"></script>
<script src="js/barcode.js?v=60"></script>
<script src="js/decode1d.js?v=60"></script>
<script src="js/lookup.js?v=60"></script>
<script src="js/sync.js?v=60"></script>
<script src="js/accounts.js?v=60"></script>
<script src="js/scan.js?v=60"></script>
<script src="js/pwa.js?v=60"></script>
<script src="js/app.js?v=60"></script>
<script src="js/shelving.js?v=60"></script>
</body>
</html>
